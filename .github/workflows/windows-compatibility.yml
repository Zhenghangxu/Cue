name: Windows compatibility

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  backend:
    name: Backend (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run backend tests
        run: uv run python -m unittest discover -s tests -v

  frontend:
    name: Frontend (Windows, Node.js 24)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: >-
          npm ci --prefix frontend
          --registry=https://registry.npmjs.org/
          --replace-registry-host=https://pkgs.dev.azure.com/digital-it-apps/_packaging/nrg-shared-feed/npm/registry

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Type-check frontend
        run: npm --prefix frontend run typecheck

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build
